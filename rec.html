<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>くく ろくおん</title>
<style>
* { box-sizing:border-box; }
body {
  margin:0; min-height:100vh; font-family:'Hiragino Maru Gothic ProN','BIZ UDGothic',sans-serif;
  color:#fff; background:#1b0f3a url('images/hero_select_bg_opt.webp') center/cover fixed;
  display:flex; flex-direction:column; align-items:center; gap:18px; padding:20px 16px;
}
button { font-family:inherit; cursor:pointer; border:none; color:inherit; }
h1 { margin:0; font-size:28px; color:#ffe27a; }
.tabs { display:flex; gap:12px; }
.tab { font-size:22px; padding:8px 22px; border-radius:16px; background:rgba(255,255,255,.15); border:2px solid #9d86e8; }
.tab.on { background:#7b4dff; border-color:#ffd76a; }
.card {
  background:rgba(20,8,60,.82); border:4px solid #ffd76a; border-radius:30px; text-align:center;
  padding:18px 40px; min-width:min(90vw,620px); box-shadow:0 0 30px rgba(255,210,90,.45);
}
#kind { font-size:22px; color:#c9b8ff; }
#word { font-size:clamp(60px,12vw,120px); font-weight:bold; color:#ffe27a; text-shadow:0 0 14px #ffcf4a; margin:6px 0; }
#eq { font-size:26px; opacity:.85; }
#status { font-size:24px; min-height:34px; margin-top:8px; }
.rec-row { display:flex; gap:16px; align-items:center; }
#recBtn {
  width:130px; height:130px; border-radius:50%; font-size:24px; font-weight:bold; white-space:nowrap;
  background:radial-gradient(#ff6b6b,#c0102a); border:6px solid #fff; box-shadow:0 0 20px rgba(255,80,80,.7);
}
#recBtn.on { animation:pulse 1s infinite; }
@keyframes pulse { 50% { box-shadow:0 0 50px 16px rgba(255,80,80,.9); } }
.sbtn { font-size:22px; padding:14px 22px; border-radius:20px; background:linear-gradient(180deg,#7b4dff,#3a1a9e); border:3px solid #ffd76a; }
.sbtn:disabled { opacity:.35; cursor:default; }
#meter { width:min(80vw,400px); height:14px; border-radius:7px; background:rgba(255,255,255,.15); overflow:hidden; }
#meter div { height:100%; width:0; background:#7dff9a; }
.list { display:grid; grid-template-columns:repeat(3, auto); gap:6px 14px; font-size:18px;
  background:rgba(20,8,60,.7); padding:12px 18px; border-radius:16px; }
.item { cursor:pointer; padding:2px 8px; border-radius:8px; opacity:.6; }
.item.done { opacity:1; color:#7dff9a; }
.item.now { background:#7b4dff; opacity:1; }
.note { font-size:15px; opacity:.8; max-width:640px; text-align:center; }
</style>
</head>
<body>
<h1>🎙 くく ろくおん</h1>
<div class="tabs">
  <button class="tab" data-dan="2">2のだん</button>
  <button class="tab" data-dan="5">5のだん</button>
</div>
<div class="card">
  <div id="kind"></div>
  <div id="word"></div>
  <div id="eq"></div>
  <div id="status"></div>
</div>
<div id="meter"><div></div></div>
<div class="rec-row">
  <button class="sbtn" id="prevBtn">◀ まえ</button>
  <button id="recBtn">ろくおん</button>
  <button class="sbtn" id="playBtn">▶ きく</button>
  <button class="sbtn" id="nextBtn">つぎ ▶</button>
</div>
<div class="list" id="list"></div>
<div class="note">スペースキー＝ろくおん開始／とめる。とめると自動で再生して保存します。だめなら もう一度 ろくおん すると上書き。<br>
はじめと終わりの無音は自動でカットします。</div>

<script src="config.js?v=3"></script>
<script>
const $ = id => document.getElementById(id);
const KIND = { q:'もんだい', a:'こたえ（げんきよく！）', f:'とおして' };
let dan = 2, items = [], idx = 0, have = new Set();
let stream = null, rec = null, chunks = [], actx = null, analyser = null, lastBuf = null;

/* そのだんで録るもの：1問ごとに q → a → f。こたえ(a)は数字ごとなので、ほかの段と重なれば1回だけ。 */
function buildItems(){
  const seen = new Set();
  items = [];
  DANS[dan].rows.forEach((r, k) => {
    const n = k + 1, ans = dan * n;
    items.push({ key:'q'+dan+'_'+n, kind:'q', word:r.q, eq:dan+' × '+n+' = ?' });
    if(!seen.has(ans)){ seen.add(ans); items.push({ key:'a'+ans, kind:'a', word:r.a+'！', eq:'こたえ '+ans }); }
    items.push({ key:'f'+dan+'_'+n, kind:'f', word:r.q+r.a, eq:dan+' × '+n+' = '+ans });
  });
}

async function loadManifest(){
  try { have = new Set(await (await fetch('voice/manifest.json?t='+Date.now())).json()); }
  catch(e){ have = new Set(); }
}

function render(){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', Number(t.dataset.dan) === dan));
  const it = items[idx];
  $('kind').textContent = (idx+1) + ' / ' + items.length + '　' + KIND[it.kind];
  $('word').textContent = it.word;
  $('eq').textContent = it.eq;
  $('status').textContent = have.has(it.key) ? '✅ ろくおん ずみ（▶で きける）' : '';
  $('playBtn').disabled = !have.has(it.key);
  $('prevBtn').disabled = idx === 0;
  $('nextBtn').disabled = idx === items.length - 1;
  $('list').innerHTML = items.map((x, k) =>
    '<span class="item' + (have.has(x.key) ? ' done' : '') + (k === idx ? ' now' : '') + '" data-k="'+k+'">' +
    (have.has(x.key) ? '✓ ' : '・') + x.word + '</span>').join('');
}

async function startRec(){
  actx = actx || new AudioContext();
  if(!stream){
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true, autoGainControl:true } });
    } catch(e){ $('status').textContent = '⚠ マイクが使えません（許可してください）'; return; }
    analyser = actx.createAnalyser(); analyser.fftSize = 1024;
    actx.createMediaStreamSource(stream).connect(analyser);
    meterLoop();
  }
  chunks = [];
  rec = new MediaRecorder(stream);
  rec.ondataavailable = e => chunks.push(e.data);
  rec.onstop = onStop;
  rec.start();
  $('recBtn').classList.add('on'); $('recBtn').textContent = 'とめる';
  $('status').textContent = '🔴 はなしてね';
}
function stopRec(){
  if(rec && rec.state === 'recording') rec.stop();
  $('recBtn').classList.remove('on'); $('recBtn').textContent = 'ろくおん';
}
function meterLoop(){
  const d = new Uint8Array(analyser.fftSize);
  (function loop(){
    analyser.getByteTimeDomainData(d);
    let m = 0; for(const v of d) m = Math.max(m, Math.abs(v - 128));
    $('meter').firstChild.style.width = Math.min(100, m / 128 * 180) + '%';
    requestAnimationFrame(loop);
  })();
}

async function onStop(){
  $('status').textContent = 'ほぞん ちゅう…';
  const raw = await actx.decodeAudioData(await new Blob(chunks).arrayBuffer());
  const pcm = trimAndNormalize(raw);
  if(!pcm){ $('status').textContent = '⚠ 声が はいっていません。もう一度！'; return; }
  const wav = encodeWav(pcm.data, pcm.rate);
  const it = items[idx];
  const res = await fetch('/save_voice?name=' + it.key, { method:'POST', body:wav });
  if(!res.ok){ $('status').textContent = '⚠ ほぞん できませんでした（' + res.status + '）'; return; }
  have.add(it.key);
  render();
  lastBuf = await actx.decodeAudioData(await wav.arrayBuffer());
  play(lastBuf);
  $('status').textContent = '✅ ほぞん しました。よければ「つぎ ▶」';
}

/* モノラル化 → 24kHzに間引き → 前後の無音カット → 音量をそろえる */
function trimAndNormalize(buf){
  const src = buf.getChannelData(0), step = Math.max(1, Math.round(buf.sampleRate / 24000));
  const rate = buf.sampleRate / step, n = Math.floor(src.length / step), x = new Float32Array(n);
  for(let i = 0; i < n; i++){ let s = 0; for(let j = 0; j < step; j++) s += src[i*step+j]; x[i] = s / step; }
  let peak = 0; for(const v of x) peak = Math.max(peak, Math.abs(v));
  if(peak < 0.02) return null;
  const th = peak * 0.08, win = Math.round(rate * 0.02);
  const loud = i => { let m = 0; for(let j = i; j < Math.min(n, i + win); j++) m = Math.max(m, Math.abs(x[j])); return m > th; };
  let a = 0; while(a < n && !loud(a)) a += win;
  let b = n - win; while(b > a && !loud(b)) b -= win;
  a = Math.max(0, a - Math.round(rate * 0.06));
  b = Math.min(n, b + win + Math.round(rate * 0.15));
  const out = x.slice(a, b), g = 0.9 / peak;
  for(let i = 0; i < out.length; i++) out[i] *= g;
  const fade = Math.min(out.length >> 1, Math.round(rate * 0.01));
  for(let i = 0; i < fade; i++){ out[i] *= i / fade; out[out.length-1-i] *= i / fade; }
  return { data:out, rate:Math.round(rate) };
}
function encodeWav(data, rate){
  const buf = new ArrayBuffer(44 + data.length * 2), v = new DataView(buf);
  const str = (o, s) => { for(let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  str(0, 'RIFF'); v.setUint32(4, 36 + data.length * 2, true); str(8, 'WAVE');
  str(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  str(36, 'data'); v.setUint32(40, data.length * 2, true);
  for(let i = 0; i < data.length; i++) v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, data[i])) * 0x7fff, true);
  return new Blob([buf], { type:'audio/wav' });
}
function play(b){
  actx = actx || new AudioContext();
  const s = actx.createBufferSource(); s.buffer = b; s.connect(actx.destination); s.start();
}
async function playSaved(){
  const it = items[idx];
  actx = actx || new AudioContext();
  const ab = await (await fetch('voice/' + it.key + '.wav?t=' + Date.now())).arrayBuffer();
  play(await actx.decodeAudioData(ab));
}

function go(k){ stopRec(); idx = Math.max(0, Math.min(items.length - 1, k)); render(); }
$('recBtn').onclick = () => (rec && rec.state === 'recording') ? stopRec() : startRec();
$('playBtn').onclick = playSaved;
$('prevBtn').onclick = () => go(idx - 1);
$('nextBtn').onclick = () => go(idx + 1);
$('list').onclick = e => { const t = e.target.closest('.item'); if(t) go(Number(t.dataset.k)); };
document.querySelectorAll('.tab').forEach(t => t.onclick = () => { stopRec(); dan = Number(t.dataset.dan); buildItems(); idx = 0; render(); });
document.addEventListener('keydown', e => {
  if(e.code === 'Space'){ e.preventDefault(); $('recBtn').click(); }
  else if(e.key === 'ArrowRight') go(idx + 1);
  else if(e.key === 'ArrowLeft') go(idx - 1);
});

buildItems();
loadManifest().then(render);
render();
</script>
</body>
</html>
