<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>くく ヒーロー</title>
<style>
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
html, body { margin:0; height:100%; }
body {
  font-family:'Hiragino Maru Gothic ProN','BIZ UDGothic','Yu Gothic',sans-serif;
  color:#fff; background:#1b0f3a url('images/hero_select_bg_opt.webp') center/cover fixed;
  overflow:hidden; touch-action:manipulation;
}
button { font-family:inherit; cursor:pointer; border:none; color:inherit; }
.screen { position:fixed; inset:0; display:none; flex-direction:column; align-items:center; padding:16px; }
.screen.on { display:flex; }
.glow { text-shadow:0 0 12px #ffcf4a, 0 3px 0 #6a3a00; }

/* ---- ホーム ---- */
#home { justify-content:center; gap:min(22px,2.6vh); }
#home h1 { font-size:clamp(40px,min(9vw,9vh),84px); margin:0; color:#ffe27a; letter-spacing:.06em; }
#home .sub { font-size:22px; opacity:.9; margin-top:-10px; }
.dan-row { display:flex; gap:28px; flex-wrap:wrap; justify-content:center; }
.dan-btn {
  width:240px; padding:22px 10px 16px; border-radius:28px;
  background:linear-gradient(180deg,#7b4dff,#3a1a9e); border:4px solid #ffd76a;
  box-shadow:0 0 24px rgba(255,210,90,.6), 0 8px 0 #22105e;
  display:flex; flex-direction:column; align-items:center; gap:6px;
}
.dan-btn:active { transform:translateY(5px); box-shadow:0 0 24px rgba(255,210,90,.6), 0 3px 0 #22105e; }
.dan-btn .big { font-size:clamp(60px,10vh,96px); font-weight:bold; line-height:1; color:#ffe27a; }
.dan-btn .lbl { font-size:30px; font-weight:bold; }
.dan-btn .stars { font-size:20px; height:26px; line-height:26px; }
.dan-col { display:flex; flex-direction:column; align-items:center; gap:min(14px,1.6vh); }
.hard-btn {
  width:240px; padding:10px; border-radius:20px; font-size:24px; font-weight:bold;
  background:linear-gradient(180deg,#ff7a3d,#b3261e); border:3px solid #ffd76a;
  box-shadow:0 0 18px rgba(255,120,60,.6), 0 6px 0 #5e140e;
}
.hard-btn:active { transform:translateY(4px); box-shadow:0 0 18px rgba(255,120,60,.6), 0 2px 0 #5e140e; }
.hard-btn .stars { display:block; font-size:16px; height:20px; line-height:20px; }
#home .hero-pair { display:flex; gap:40px; }
#home .hero-pair img { width:min(150px,16vh); filter:drop-shadow(0 0 14px rgba(255,220,120,.7)); }

/* ---- プレイ ---- */
#play { justify-content:space-between; }
.topbar { width:100%; display:flex; align-items:center; justify-content:space-between; }
.icon-btn { font-size:34px; width:64px; height:64px; border-radius:50%; background:rgba(255,255,255,.15); border:3px solid #9d86e8; }
.dots { display:flex; gap:10px; }
.dot { width:24px; height:24px; border-radius:50%; background:rgba(255,255,255,.2); border:2px solid #b8a6ff; }
.dot.done { background:#ffd23f; border-color:#fff3b0; box-shadow:0 0 10px #ffd23f; }
.dot.now { background:#fff; transform:scale(1.25); }

.main { flex:1; min-height:0; width:100%; display:flex; flex-direction:column; align-items:center; justify-content:space-around; }
@media (orientation:landscape) {
  .main { flex-direction:row; justify-content:center; gap:30px; }
  .stage { flex-direction:column; flex:0 1 auto !important; gap:4px !important; }
  #hero { width:min(22vh,190px) !important; }
}
.stage { display:flex; align-items:center; justify-content:center; gap:20px; }
#hero { width:min(28vw,230px); filter:drop-shadow(0 0 16px rgba(255,220,120,.6)); transition:transform .2s; }
#hero.jump { animation:jump .6s; }
@keyframes jump { 0%,100%{transform:translateY(0)} 40%{transform:translateY(-40px) scale(1.08)} }
.card {
  background:rgba(20,8,60,.78); border:4px solid #ffd76a; border-radius:30px;
  padding:16px 28px; text-align:center; box-shadow:0 0 30px rgba(255,210,90,.45);
  min-width:min(60vw,460px);
}
#eq { font-size:clamp(56px,11vw,104px); font-weight:bold; white-space:nowrap; }
#ans { display:inline-block; min-width:1.4em; border-bottom:6px solid #ffd76a; color:#ffe27a; }
#ans.empty { color:rgba(255,255,255,.35); }
#reading { font-size:clamp(28px,5vw,44px); margin-top:6px; min-height:1.3em; color:#ffe9b0; }
#reading .hl { color:#ffd23f; }
#praise { font-size:34px; height:44px; color:#7dff9a; font-weight:bold; }
#praise.late { color:#ffa94d; }
.timer { display:flex; align-items:center; gap:10px; margin-top:4px; }
.timer.off { visibility:hidden; }
.tbar { flex:1; height:16px; border-radius:8px; background:rgba(255,255,255,.15); overflow:hidden; }
.tbar div { height:100%; width:100%; background:#7dff9a; border-radius:8px; transition:width .25s linear, background .3s; }
.tbar div.warn { background:#ffd23f; }
.tbar div.hurry { background:#ff6b6b; }
#tnum { font-size:26px; font-weight:bold; min-width:2.6em; text-align:right; }
.timer-pick { display:flex; align-items:center; gap:10px; font-size:22px; }
.timer-pick button { font-size:22px; padding:8px 16px; border-radius:16px; background:rgba(20,8,60,.7); border:3px solid #9d86e8; }
.timer-pick button.on { background:#2a7a45; border-color:#7dff9a; box-shadow:0 0 14px rgba(125,255,154,.6); }
.card.shake { animation:shake .4s; }
@keyframes shake { 20%{transform:translateX(-14px)} 40%{transform:translateX(14px)} 60%{transform:translateX(-8px)} 80%{transform:translateX(8px)} }
.card.ok { border-color:#7dff9a; box-shadow:0 0 40px rgba(125,255,154,.8); }

.keypad { display:grid; grid-template-columns:repeat(3, min(22vw,130px)); gap:12px; padding-bottom:6px; }
.key {
  height:min(14vh,100px); border-radius:22px; font-size:clamp(40px,6vh,54px); font-weight:bold;
  background:linear-gradient(180deg,#fff8e0,#ffd76a); color:#3a1a6e;
  box-shadow:0 6px 0 #b07a10;
}
.key:active, .key.press { transform:translateY(4px); box-shadow:0 2px 0 #b07a10; }
.key.del { font-size:26px; background:linear-gradient(180deg,#e9e3ff,#a998e8); box-shadow:0 6px 0 #5b4aa8; }
.key.hint { animation:hint 1s infinite; }
@keyframes hint { 50%{ box-shadow:0 0 30px 10px #7dff9a, 0 6px 0 #b07a10; } }
.keypad.lock { pointer-events:none; }

/* ---- クリア ---- */
#clear { justify-content:center; gap:14px; }
#clear h2 { font-size:clamp(44px,8vw,72px); margin:0; color:#ffe27a; }
#clearHero { width:200px; animation:jump 1.2s infinite; }
.table { background:rgba(20,8,60,.78); border:3px solid #ffd76a; border-radius:20px; padding:10px 24px;
  display:grid; grid-template-columns:auto auto; column-gap:28px; row-gap:2px; font-size:24px; }
.table .r { color:#ffe9b0; }
.table .m { font-size:20px; color:#ff9a6a; }
.btn-row { display:flex; gap:20px; }
.big-btn { font-size:28px; font-weight:bold; padding:16px 30px; border-radius:24px;
  background:linear-gradient(180deg,#7b4dff,#3a1a9e); border:3px solid #ffd76a; box-shadow:0 6px 0 #22105e; }
</style>
</head>
<body>

<!-- ホーム -->
<section id="home" class="screen on">
  <h1 class="glow">くく ヒーロー</h1>
  <div class="sub">どの だんに する？</div>
  <div class="dan-row">
    <div class="dan-col">
      <button class="dan-btn" data-dan="2"><span class="big glow">2</span><span class="lbl">のだん</span><span class="stars" id="stars2"></span></button>
      <button class="hard-btn" data-dan="2">🔥 ばらばら<span class="stars" id="stars2r"></span></button>
    </div>
    <div class="dan-col">
      <button class="dan-btn" data-dan="5"><span class="big glow">5</span><span class="lbl">のだん</span><span class="stars" id="stars5"></span></button>
      <button class="hard-btn" data-dan="5">🔥 ばらばら<span class="stars" id="stars5r"></span></button>
    </div>
  </div>
  <div class="timer-pick" id="timerPick"></div>
  <div class="hero-pair"><img id="homeHeroL" alt=""><img id="homeHeroR" alt=""></div>
</section>

<!-- プレイ -->
<section id="play" class="screen">
  <div class="topbar">
    <button class="icon-btn" id="homeBtn">🏠</button>
    <div class="dots" id="dots"></div>
    <button class="icon-btn" id="againBtn">🔊</button>
  </div>
  <div class="main">
  <div class="stage">
    <img id="hero" alt="">
    <div class="card" id="card">
      <div id="eq"></div>
      <div id="reading"></div>
      <div id="praise"></div>
      <div class="timer" id="timer"><div class="tbar"><div id="tbar"></div></div><span id="tnum"></span></div>
    </div>
  </div>
  <div class="keypad" id="keypad"></div>
  </div>
</section>

<!-- クリア -->
<section id="clear" class="screen">
  <h2 class="glow" id="clearTitle"></h2>
  <img id="clearHero" alt="">
  <div class="table" id="clearTable"></div>
  <div class="btn-row">
    <button class="big-btn" id="retryBtn">もういっかい</button>
    <button class="big-btn" id="backBtn">🏠 もどる</button>
  </div>
</section>

<!-- 公開版(GitHub Pages)は index.html が最大10分キャッシュされるので、JSは毎回最新を読む -->
<script>
['config.js', 'app.js'].forEach(f => document.write('<script src="' + f + '?t=' + Date.now() + '"><\/script>'));
</script>
</body>
</html>
